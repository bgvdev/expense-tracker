# Render Blueprint (Infrastructure-as-Code) for the Laravel API.
# Docs: https://render.com/docs/blueprint-spec
#
# Migrations & reference-data seeding run automatically on boot via
# backend/docker-entrypoint.sh (the free tier has the Shell disabled, so they
# MUST be automatic). `healthCheckPath` makes Render wait for /api/health before
# routing traffic to a new deploy.
#
# Secrets are marked `sync: false` — set their values in the Render dashboard,
# they are intentionally not committed here.
services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true            # deploy on push to main (gated upstream by branch protection)
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false             # php artisan key:generate --show, set once in dashboard
      - key: LOG_LEVEL
        value: error
      # ── Database (Neon) ──────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false             # full Neon DSN
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      # ── Frontend / CORS ──────────────────────────────────────────────
      - key: CORS_ALLOWED_ORIGINS
        sync: false             # e.g. https://your-app.vercel.app
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      # ── Seeding: never seed the test user in production ───────────────
      - key: SEED_TEST_USER
        value: "false"
      # ── Sentry ───────────────────────────────────────────────────────
      - key: SENTRY_LARAVEL_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
