# Render Blueprint (Infrastructure-as-Code) for the Laravel API.
# Docs: https://render.com/docs/blueprint-spec
#
# Deployment is Docker-only — no GitHub Actions. On every push to main, Render
# builds the Docker image from backend/Dockerfile, the entrypoint
# (backend/docker-entrypoint.sh) runs migrations + reference-data seeding, then
# `healthCheckPath` makes Render wait for /api/health to return 200 before
# routing traffic to the new deploy. The free tier has the Shell disabled, so
# migrations MUST stay automatic in the entrypoint.
#
# Secrets are marked `sync: false` — set their values in the Render dashboard,
# they are intentionally not committed here.
services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true            # deploy on every push to main
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false             # php artisan key:generate --show, set once in dashboard
      - key: LOG_LEVEL
        value: error
      - key: APP_NAME
        value: "Expense Tracker"
      - key: APP_URL
        sync: false             # public URL of this service (SMTP EHLO domain, links)
      - key: BCRYPT_ROUNDS
        value: "12"
      # ── Database (Neon) ──────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false             # full Neon pooled DSN (used by the app at runtime)
      - key: DB_MIGRATE_URL
        sync: false             # direct (non-pooled) Neon DSN — used only for migrations
                                # same as DATABASE_URL but without "-pooler" in the hostname
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      # ── Frontend / CORS ──────────────────────────────────────────────
      - key: CORS_ALLOWED_ORIGINS
        sync: false             # e.g. https://your-app.vercel.app
                                # REQUIRED: there is no production default. An
                                # empty value allows no cross-origin requests.
      - key: FRONTEND_URL
        sync: false             # e.g. https://your-app.vercel.app — used for the
                                # links in welcome/password-reset emails, which
                                # otherwise fall back to http://localhost:3000
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # ── Mail (REQUIRED) ──────────────────────────────────────────────
      # Without these, config/mail.php falls back to the 'log' driver and the
      # password-reset OTP and welcome emails are silently written to the log
      # instead of being sent. See backend/.env.example for the Gmail App
      # Password setup.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false             # 16-char Gmail App Password, never a login password
      - key: MAIL_FROM_ADDRESS
        sync: false
      # ── Auth ─────────────────────────────────────────────────────────
      - key: SANCTUM_TOKEN_EXPIRATION
        value: "10080"          # 7 days, in minutes
      - key: API_RATE_LIMIT
        value: "120"            # requests/minute per authenticated user
      # ── Seeding: never seed the test user in production ───────────────
      - key: SEED_TEST_USER
        value: "false"
      # ── Sentry ───────────────────────────────────────────────────────
      - key: SENTRY_LARAVEL_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
