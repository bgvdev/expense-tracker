name: Keep Backend Alive

on:
  schedule:
    - cron: '*/13 * * * *'  # every 13 min — Render sleeps after 15 min of inactivity
  workflow_dispatch:         # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://expense-tracker-funw.onrender.com/api/health)
          echo "Backend responded with HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
