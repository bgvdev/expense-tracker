services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: expense_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-expense_tracker}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${DB_HOST_PORT:-15432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - expense_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-expense_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Laravel API ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_tracker_api
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-expense_tracker}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # Must match the browser origin, i.e. WEB_HOST_PORT below.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:13000}
      SANCTUM_TOKEN_EXPIRATION: ${SANCTUM_TOKEN_EXPIRATION:-10080}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-120}
      # Matches production: keeps the rate limiter's cache reads/writes out of
      # the database. See the CACHE_STORE comment in render.yaml.
      CACHE_STORE: ${CACHE_STORE:-file}
      # Mail: unset means Laravel falls back to the 'log' driver, so OTP and
      # welcome emails land in storage/logs instead of being sent. Fine locally.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:13000}
      SEED_TEST_USER: ${SEED_TEST_USER:-true}
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      # storage/ and bootstrap/cache MUST be container-owned volumes, not part of
      # the bind mount. The container runs as www-data and therefore cannot chown
      # host-owned paths, so a fresh clone would fail with "The bootstrap/cache
      # directory must be present and writable". Named volumes are initialised
      # from the image, where both are already owned by www-data.
      # To read the Laravel log: docker compose exec api cat storage/logs/laravel.log
      - backend_storage:/var/www/html/storage
      - backend_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Verifies the DB too, so an api container that cannot reach Postgres is
      # reported unhealthy rather than merely "running".
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - expense_net

  # ── Next.js Frontend ─────────────────────────────────────────────────────
  # Dependencies live in the frontend_node_modules volume, which MASKS any
  # host-side ./frontend/node_modules — there is no need to run npm install on
  # the host. Note the container creates node_modules/ and .next/ as root, so
  # host-side `npm run lint` may need `docker compose exec web npm run lint`.
  web:
    image: node:20-alpine
    container_name: expense_tracker_web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${WEB_HOST_PORT:-13000}:3000"
    environment:
      # The only variable that affects where API calls go: next.config.ts proxies
      # /api/* here. Works as a runtime var only because this service runs
      # `next dev`; a built image needs it as a --build-arg.
      BACKEND_URL: "http://api:8000"
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    # Fail loudly if the install fails instead of running `next dev` against an
    # empty node_modules and reporting a confusing "next: not found".
    command: sh -c "npm install --prefer-offline && npm run dev"
    depends_on:
      api:
        condition: service_started
    networks:
      - expense_net

volumes:
  db_data:
  backend_vendor:
  backend_storage:
  backend_bootstrap_cache:
  frontend_node_modules:

networks:
  expense_net:
    driver: bridge
