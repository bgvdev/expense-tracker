name: Post-Deploy Verify

# Runs after code lands on main. Render & Vercel auto-deploy natively on push;
# this workflow verifies the API came back healthy and records a Sentry release
# so errors are attributed to the right commit.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-verify
  cancel-in-progress: false

env:
  HEALTH_URL: https://expense-tracker-funw.onrender.com/api/health

jobs:
  health-check:
    name: Health check
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deploy to go live
        # Render builds the image, runs migrations in the entrypoint, then passes
        # its own /api/health gate. Poll for up to ~12 min (build + cold start).
        run: |
          echo "Polling $HEALTH_URL ..."
          for i in $(seq 1 72); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$HEALTH_URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✅ Backend healthy after $((i*10))s (HTTP $code)"
              exit 0
            fi
            echo "  attempt $i/72 — HTTP $code, retrying in 10s"
            sleep 10
          done
          echo "❌ Backend never returned 200 — deploy may have failed"
          exit 1

  sentry-release:
    name: Sentry release
    runs-on: ubuntu-latest
    needs: health-check
    # Skip cleanly if Sentry secrets aren't configured yet.
    if: ${{ vars.SENTRY_ORG != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}
