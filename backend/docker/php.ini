; Production PHP tuning, copied into /usr/local/etc/php/conf.d/ by the Dockerfile.
;
; The php:8.3-fpm base image ships OPcache as an available extension but does NOT
; enable it. Without it every request recompiles the whole framework from source,
; which on Render's free plan (0.1 shared vCPU) was the single largest slice of
; server time — a trivial /api/health request cost ~300ms of CPU.
[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; validate_timestamps stays ON deliberately. Turning it off is marginally faster
; (it skips one stat() per file per revalidate window) but it also freezes the
; opcode cache against the bind-mounted source in local dev, where edits would
; then appear to have no effect. revalidate_freq=2 keeps the stat traffic
; negligible while leaving dev behaviour correct.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Required: Laravel reads PHP attributes/docblocks at runtime.
opcache.save_comments=1

[php]
; Laravel resolves a lot of paths per request; caching the realpath lookups
; avoids repeating those syscalls.
realpath_cache_size=4096K
realpath_cache_ttl=600
